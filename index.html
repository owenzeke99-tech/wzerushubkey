<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wzerus Hub Key</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    min-height: 100vh;
    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(130, 35, 255, .13),
            transparent 42%
        ),
        #050308;

    color: white;
    font-family: 'Orbitron', sans-serif;
}

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.light {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .35;
}

.light.one {
    width: 360px;
    height: 360px;
    background: #8a20ff;
    top: -180px;
    left: -150px;
    animation: lightOne 9s ease-in-out infinite alternate;
}

.light.two {
    width: 400px;
    height: 400px;
    background: #5200ff;
    right: -200px;
    bottom: -200px;
    animation: lightTwo 11s ease-in-out infinite alternate;
}

.light.three {
    width: 240px;
    height: 240px;
    background: #c044ff;
    left: 45%;
    top: 50%;
    opacity: .10;
    animation: lightThree 7s ease-in-out infinite alternate;
}

@keyframes lightOne {
    from { transform: translate(0, 0); }
    to { transform: translate(180px, 130px); }
}

@keyframes lightTwo {
    from { transform: translate(0, 0); }
    to { transform: translate(-150px, -120px); }
}

@keyframes lightThree {
    from { transform: translate(-50%, -50%) scale(.7); }
    to { transform: translate(-50%, -50%) scale(1.3); }
}

.grid {
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(rgba(153, 65, 255, .12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(153, 65, 255, .12) 1px, transparent 1px);
    background-size: 55px 55px;
    opacity: .18;
    mask-image: radial-gradient(circle, black 20%, transparent 80%);
    animation: gridMove 18s linear infinite;
}

@keyframes gridMove {
    from { background-position: 0 0; }
    to { background-position: 110px 110px; }
}

.particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #c278ff;
    box-shadow: 0 0 7px #a53dff, 0 0 15px #7c20ff;
    animation: particleUp linear infinite;
}

@keyframes particleUp {
    0% {
        transform: translateY(110vh) scale(.4);
        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    80% {
        opacity: .6;
    }

    100% {
        transform: translateY(-15vh) scale(1.3);
        opacity: 0;
    }
}

.card {
    position: relative;
    z-index: 10;

    width: min(92%, 480px);

    padding: 42px 30px 30px;

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(31, 14, 50, .94),
            rgba(7, 4, 12, .96)
        );

    border: 1px solid rgba(177, 88, 255, .22);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    box-shadow:
        0 35px 100px rgba(0,0,0,.8),
        0 0 80px rgba(117,25,255,.12),
        inset 0 1px 0 rgba(255,255,255,.06);

    animation: cardEnter .9s cubic-bezier(.2,.8,.2,1);
}

.card::before {
    content: "";

    position: absolute;
    inset: -1px;

    border-radius: 29px;

    padding: 1px;

    background:
        linear-gradient(
            120deg,
            transparent,
            #a83cff,
            transparent,
            #6820ff,
            transparent
        );

    background-size: 300% 300%;

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

    -webkit-mask-composite: xor;
    mask-composite: exclude;

    animation: borderFlow 4s linear infinite;

    pointer-events: none;
}

@keyframes borderFlow {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

@keyframes cardEnter {
    from {
        opacity: 0;
        transform: translateY(35px) scale(.94);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


/* =========================
   LOGO - PERFECT CENTER
========================= */

.logo-wrapper {
    width: 120px;
    height: 120px;

    margin: 0 auto 24px;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    /* FIX: không dùng left / translate nữa */
    left: auto;
    transform: none;
}

.logo-ring {
    position: absolute;

    width: 116px;
    height: 116px;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    border: 1px solid rgba(181, 76, 255, .25);

    border-top-color: #b24cff;
    border-right-color: #7925ff;

    animation: ringRotate 3.5s linear infinite;

    box-shadow:
        0 0 20px rgba(141,42,255,.2);
}

.logo-ring::before {
    content: "";

    position: absolute;

    inset: 8px;

    border-radius: 50%;

    border: 1px dashed rgba(199, 121, 255, .28);

    animation:
        ringRotateReverse
        5s linear infinite;
}

@keyframes ringRotate {
    to {
        transform:
            translate(-50%, -50%)
            rotate(360deg);
    }
}

@keyframes ringRotateReverse {
    to {
        transform: rotate(-360deg);
    }
}

.logo {
    width: 94px;
    height: 94px;

    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 27px;

    background:
        radial-gradient(
            circle at 50% 30%,
            #401266,
            #09050e 70%
        );

    border:
        1px solid rgba(192,103,255,.38);

    box-shadow:
        0 0 20px rgba(153,43,255,.35),
        0 0 50px rgba(111,20,255,.2),
        inset 0 0 30px rgba(176,65,255,.08);

    animation:
        logoFloat
        3s ease-in-out infinite;

    overflow: hidden;
}

.logo::before {
    content: "";

    position: absolute;

    width: 130%;
    height: 20px;

    left: -15%;
    top: 50%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.25),
            transparent
        );

    transform:
        rotate(-45deg)
        translateX(-130px);

    animation:
        logoShine
        3.5s ease-in-out infinite;
}

@keyframes logoShine {
    0% {
        transform:
            rotate(-45deg)
            translateX(-130px);
    }

    60%,
    100% {
        transform:
            rotate(-45deg)
            translateX(130px);
    }
}


/* =========================
   W LETTER - STRAIGHT CENTER
========================= */

.logo span {
    position: absolute;

    z-index: 5;

    left: 50%;
    top: 50%;

    /* FIX: căn giữa tuyệt đối */
    transform:
        translate(-50%, -50%);

    width: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    font-size: 61px;

    font-weight: 900;

    font-style: normal;

    /* FIX: bỏ letter spacing âm */
    letter-spacing: 0;

    line-height: 1;

    background:
        linear-gradient(
            135deg,
            #ffffff 0%,
            #e0aaff 30%,
            #a044ff 65%,
            #ffffff 100%
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    filter:
        drop-shadow(
            0 0 7px
            rgba(196,91,255,.9)
        )
        drop-shadow(
            0 0 24px
            rgba(125,25,255,.55)
        );

    animation:
        wPulse
        2.2s ease-in-out infinite;
}

@keyframes logoFloat {
    0%,100% {
        margin-top: 0;
    }

    50% {
        margin-top: -8px;
    }
}

@keyframes wPulse {
    0%,100% {
        filter:
            drop-shadow(
                0 0 6px
                rgba(196,91,255,.7)
            );
    }

    50% {
        filter:
            drop-shadow(
                0 0 14px
                rgba(205,107,255,1)
            )
            drop-shadow(
                0 0 30px
                rgba(125,25,255,.7)
            );
    }
}


/* =========================
   TITLE
========================= */

.title {
    width: 100%;

    display: block;

    text-align: center;

    font-size: 30px;

    font-weight: 900;

    line-height: 1.2;

    letter-spacing: 1px;

    margin-left: 0;
    margin-right: 0;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #dca3ff,
            #8e3dff,
            #ffffff
        );

    background-size: 250% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        titleShine
        4s linear infinite;

    filter:
        drop-shadow(
            0 0 12px
            rgba(148,45,255,.2)
        );
}

@keyframes titleShine {
    to {
        background-position:
            250% center;
    }
}

.subtitle {
    width: 100%;

    text-align: center;

    margin-top: 10px;

    color: #95859f;

    font-family: Arial, sans-serif;

    font-size: 13px;

    letter-spacing: .4px;
}

.divider {
    width: 110px;
    height: 2px;

    margin: 18px auto 25px;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ad4dff,
            transparent
        );

    box-shadow:
        0 0 14px #8c27ff;

    animation:
        dividerPulse
        2s ease-in-out infinite;
}

@keyframes dividerPulse {
    0%,100% {
        width: 70px;
        opacity: .4;
    }

    50% {
        width: 140px;
        opacity: 1;
    }
}

.label {
    margin-bottom: 9px;

    color: #a998b4;

    font-family: Arial, sans-serif;

    font-size: 11px;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 1.7px;
}

.key-box {
    width: 100%;

    min-height: 68px;

    display: flex;

    align-items: center;

    gap: 12px;

    padding:
        10px
        10px
        10px
        17px;

    border-radius: 17px;

    background:
        linear-gradient(
            135deg,
            rgba(147,48,255,.09),
            rgba(255,255,255,.025)
        );

    border:
        1px solid
        rgba(173,86,255,.2);

    box-shadow:
        inset 0 0 25px
        rgba(145,38,255,.04);

    transition: .3s ease;
}

.key-box:hover {
    border-color:
        rgba(191,103,255,.5);

    box-shadow:
        0 0 30px
        rgba(121,35,255,.14);
}

.key {
    flex: 1;

    color: #eadff1;

    font-family: Arial, sans-serif;

    font-size: 12px;

    line-height: 1.5;

    word-break: break-all;

    user-select: all;
}

.copy {
    min-width: 112px;

    height: 45px;

    border: 0;

    outline: none;

    border-radius: 13px;

    cursor: pointer;

    color: white;

    font-family: 'Orbitron', sans-serif;

    font-size: 11px;

    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #a13cff,
            #6514d9
        );

    box-shadow:
        0 8px 25px
        rgba(113,24,255,.4),

        inset 0 1px 0
        rgba(255,255,255,.25);

    transition: .25s ease;
}

.copy:hover {
    transform: translateY(-3px);

    box-shadow:
        0 13px 35px
        rgba(128,35,255,.55),

        0 0 25px
        rgba(144,50,255,.25);
}

.copy:active {
    transform: scale(.94);
}

.copy.copied {
    background:
        linear-gradient(
            135deg,
            #ca7aff,
            #8734f0
        );
}

.status {
    height: 20px;

    margin-top: 13px;

    text-align: center;

    color: #c58cff;

    font-family: Arial, sans-serif;

    font-size: 12px;

    opacity: 0;

    transition: .3s ease;
}

.status.show {
    opacity: 1;
}

.footer {
    margin-top: 20px;

    padding-top: 18px;

    border-top:
        1px solid
        rgba(255,255,255,.06);

    text-align: center;

    color: #594c63;

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 2px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .card {
        width: 92%;

        padding:
            34px
            18px
            24px;
    }

    .logo-wrapper {
        width: 108px;
        height: 108px;

        margin-left: auto;
        margin-right: auto;

        left: auto;
        transform: none;
    }

    .logo-ring {
        width: 106px;
        height: 106px;
    }

    .logo {
        width: 88px;
        height: 88px;
    }

    .logo span {
        font-size: 51px;

        left: 50%;
        top: 50%;

        transform:
            translate(-50%, -50%);
    }

    .title {
        font-size: 24px;

        text-align: center;
    }

    .key-box {
        flex-direction: column;

        align-items: stretch;

        padding: 14px;
    }

    .key {
        text-align: center;

        font-size: 11px;
    }

    .copy {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="background">

    <div class="light one"></div>
    <div class="light two"></div>
    <div class="light three"></div>

    <div class="grid"></div>

    <span class="particle"
        style="left:4%;animation-duration:9s;animation-delay:1s">
    </span>

    <span class="particle"
        style="left:12%;animation-duration:13s;animation-delay:3s">
    </span>

    <span class="particle"
        style="left:21%;animation-duration:10s;animation-delay:5s">
    </span>

    <span class="particle"
        style="left:30%;animation-duration:14s;animation-delay:2s">
    </span>

    <span class="particle"
        style="left:41%;animation-duration:11s;animation-delay:6s">
    </span>

    <span class="particle"
        style="left:52%;animation-duration:15s;animation-delay:1s">
    </span>

    <span class="particle"
        style="left:63%;animation-duration:10s;animation-delay:4s">
    </span>

    <span class="particle"
        style="left:74%;animation-duration:13s;animation-delay:2s">
    </span>

    <span class="particle"
        style="left:84%;animation-duration:9s;animation-delay:5s">
    </span>

    <span class="particle"
        style="left:94%;animation-duration:12s;animation-delay:3s">
    </span>

</div>


<div class="card">

    <div class="logo-wrapper">

        <div class="logo-ring"></div>

        <div class="logo">

            <span>W</span>

        </div>

    </div>


    <h1 class="title">
        Wzerus Hub Key
    </h1>


    <p class="subtitle">
        Your private key is ready to use
    </p>


    <div class="divider"></div>


    <div class="label">
        Your Key
    </div>


    <div class="key-box">

        <div class="key" id="key">
            WzeusHubKeyHdieHyperPuhusowhGskwhdjVdiwoejeo
        </div>


        <button
            class="copy"
            id="copyButton"
            onclick="copyKey()">

            COPY KEY

        </button>

    </div>


    <div
        class="status"
        id="status">

        Key copied successfully!

    </div>


    <div class="footer">

        WZERUS HUB • KEY SYSTEM

    </div>

</div>


<script>

const KEY =
"WzeusHubKeyHdieHyperPuhusowhGskwhdjVdiwoejeo";


async function copyKey() {

    const button =
        document.getElementById("copyButton");

    const status =
        document.getElementById("status");


    try {

        await navigator.clipboard
            .writeText(KEY);

    } catch (error) {

        const textarea =
            document.createElement("textarea");

        textarea.value = KEY;

        textarea.style.position = "fixed";

        textarea.style.opacity = "0";

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        textarea.remove();
    }


    button.innerText =
        "COPIED ✓";

    button.classList.add(
        "copied"
    );

    status.classList.add(
        "show"
    );


    setTimeout(() => {

        button.innerText =
            "COPY KEY";

        button.classList.remove(
            "copied"
        );

        status.classList.remove(
            "show"
        );

    }, 2200);

}

</script>

</body>
</html>
